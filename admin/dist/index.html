<body class="min-h-screen bg-background font-sans antialiased">
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      var d = (!t || t === 'system')
        ? window.matchMedia('(prefers-color-scheme: dark)').matches
        : t === 'dark';
      if (d) document.documentElement.classList.add('dark');
    })();
  </script>
  <div id="root"></div>
</body>
