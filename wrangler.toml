name = "wp-cms-v2"
main = "src/index.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Secrets (set via: wrangler secret put <NAME>):
#   JWT_SECRET, RESEND_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET

[vars]
# Admin domain for this staging worker = the workers.dev subdomain.
# Replace after first deploy if you point a custom subdomain at wp-cms-v2.
ADMIN_DOMAIN = "wp-cms-v2.workers.dev"

# --------------------------------------------------------------------------
# IMPORTANT: Isolation from production wp-cms
# --------------------------------------------------------------------------
# This worker is the React SSR migration target. It MUST NOT share any
# bindings, routes or cron triggers with the existing production wp-cms
# worker. The old worker keeps serving workercms.com / *.workercms.com
# from its own D1 (cms-db) and R2 (cms-media).
#
# - No [[routes]] blocks below: this worker only serves on
#   https://wp-cms-v2.<account>.workers.dev
# - No [triggers] cron: AI / contety / domain-check jobs keep running on
#   the old worker so we don't double-process production data.
# - Fresh D1 (cms-db-v2) and fresh R2 (cms-media-v2) bindings below.
# --------------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "cms-db-v2"
database_id = "d8d0b0b5-4e1a-4097-a110-f8c7b0dc8c63"

[[r2_buckets]]
binding = "R2"
bucket_name = "cms-media-v2"

[site]
bucket = "./admin/dist"
